<script>
/* FIRE PARTICLES ANIMATION */
const canvas = document.getElementById('fireCanvas');
const ctx = canvas.getContext('2d');
let particles = [];

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

window.addEventListener('resize', resize);
resize();

class Particle {
  constructor() {
    this.reset();
  }
  reset() {
    this.x = Math.random() * canvas.width;
    this.y = canvas.height + Math.random() * 100;
    this.size = Math.random() * 2 + 1;
    this.speedY = Math.random() * 1 + 0.5;
    this.speedX = Math.random() * 0.5 - 0.25;
    this.opacity = Math.random() * 0.5 + 0.2;
    this.fade = Math.random() * 0.005 + 0.002;
  }
  update() {
    this.y -= this.speedY;
    this.x += this.speedX;
    this.opacity -= this.fade;
    if (this.opacity <= 0 || this.y < -10) {
      this.reset();
    }
  }
  draw() {
    ctx.fillStyle = `rgba(255, 126, 33, ${this.opacity})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    // Subtle glow
    ctx.shadowBlur = 10;
    ctx.shadowColor = 'rgba(255, 126, 33, 0.5)';
  }
}

function initParticles() {
  particles = [];
  const count = window.innerWidth < 768 ? 30 : 60;
  for (let i = 0; i < count; i++) {
    particles.push(new Particle());
  }
}

/* Re-init particles on resize if crossing threshold */
let wasMobile = window.innerWidth < 768;
window.addEventListener('resize', () => {
  const isMobile = window.innerWidth < 768;
  if (isMobile !== wasMobile) {
    wasMobile = isMobile;
    initParticles();
  }
});

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => {
    p.update();
    p.draw();
  });
  requestAnimationFrame(animate);
}

initParticles();
animate();

/* API LOGIC */
let allCourses = [];
let currentFilter = 'all';

async function fetchCourses() {
  try {
    const payload = {
      course_id: '0',
      parent_id: '0',
      folder_id: '',
      content_category_id: '',
      is_purchased: '0'
    };

    const data = await API.post('home-content', payload, 'nexttoppers-home');
    
    if (data.success && data.data) {
      if (Array.isArray(data.data)) {
        const trendingLayout = data.data.find(layout => layout.layout_type === 'layout_trending_course');
        allCourses = trendingLayout?.list || data.data || [];
      } else {
        allCourses = data.data.list || data.data.data || [];
      }
    }
  } catch (error) {
    console.warn('API Proxy Fetch Error:', error.message);
  } finally {
    // Manually add the Sanskrit and Custom Courses
    const manualCourses = [
      {
        id: "44743",
        title: "JUNNON PRO BATCH CLASS 10 - 2027",
        thumbnail: "https://d1xo3otg0k74xn.cloudfront.net/566/admin_v1/bundle_management/course/45193644743_PRO%202027%20BANNER%20.jpg",
        is_sanskrit: true,
        is_parent: true
      },
      {
        id: "78",
        title: "Abhay 10th Batch 2026 without Brahmastra",
        thumbnail: "https://dylnd2lqy6eys.cloudfront.net/540/admin_v1/bundle_management/course/626308539904_abhay_10th_banner_app_2026.png",
        is_old: true
      },
      {
        id: "62",
        title: "AARAMBH 2.O 10th BATCH 25-26",
        thumbnail: "https://dylnd2lqy6eys.cloudfront.net/540/admin_v1/bundle_management/course/285939929246_10th_aarambh_2.0_banner_app.jpg",
        is_old: true
      },
{
        id: "176",
        title: "AARAMBH 10th BATCH 26-27",
        thumbnail: "https://dylnd2lqy6eys.cloudfront.net/1770981347/admin_v2/uploads/courses/thumbnail/4628574_125_aarambh%20banner%20app%202026%202.jpg",
        is_old: false
      }
    ];
    
    manualCourses.forEach(mCourse => {
      if (!allCourses.find(c => c.id == mCourse.id)) {
        allCourses.push(mCourse);
      }
    });
    
    // Sort A-Z by title
    allCourses.sort((a, b) => (a.title || '').localeCompare(b.title || ''));
    
    if (allCourses.length > 0) {
      generateFilterTags();
      applyFilters();
      document.getElementById('batchCount').textContent = `${allCourses.length} Batches Available`;
    }
    document.getElementById('loadingOverlay').classList.add('hidden');
  }
}

function generateFilterTags() {
  const tagsContainer = document.getElementById('filterTags');
  const categories = new Set();
  
  allCourses.forEach(course => {
    const title = course.title || '';
    if (title.match(/10th/i) || title.match(/class\s*10/i)) categories.add('Class 10th');
    if (title.match(/9th/i) || title.match(/class\s*9/i)) categories.add('Class 9th');
    if (title.match(/8th/i) || title.match(/class\s*8/i)) categories.add('Class 8th');
    
    if (title.match(/11th/i) || title.match(/class\s*11/i)) {
      if (title.match(/pcmb/i)) categories.add('Class 11th PCMB');
      else if (title.match(/commerce/i)) categories.add('Class 11th Commerce');
      else if (title.match(/humanities/i)) categories.add('Class 11th Humanities');
      else categories.add('Class 11th');
    }
    
    if (title.match(/12th/i) || title.match(/class\s*12/i)) {
      if (title.match(/pcmb/i)) categories.add('Class 12th PCMB');
      else if (title.match(/commerce/i)) categories.add('Class 12th Commerce');
      else if (title.match(/humanities/i)) categories.add('Class 12th Humanities');
      else categories.add('Class 12th');
    }
    
    if (title.match(/cuet/i)) {
      if (title.match(/science/i)) categories.add('CUET (Science)');
      else if (title.match(/commerce/i)) categories.add('CUET Commerce');
      else if (title.match(/humanities/i)) categories.add('CUET Humanities');
      else categories.add('CUET');
    }
  });

  // Define sort order for classes
  const order = [
    'Class 8th', 'Class 9th', 'Class 10th', 
    'Class 11th', 'Class 11th PCMB', 'Class 11th Commerce', 'Class 11th Humanities',
    'Class 12th', 'Class 12th PCMB', 'Class 12th Commerce', 'Class 12th Humanities',
    'CUET', 'CUET (Science)', 'CUET Commerce', 'CUET Humanities'
  ];

  const sortedCats = Array.from(categories).sort((a, b) => {
    let indexA = order.indexOf(a);
    let indexB = order.indexOf(b);
    if (indexA === -1) indexA = 99;
    if (indexB === -1) indexB = 99;
    return indexA - indexB;
  });

  let html = `<button class="filter-tag active" data-filter="all">All</button>`;
  sortedCats.forEach(cat => {
    html += `<button class="filter-tag" data-filter="${cat}">${cat}</button>`;
  });
  
  tagsContainer.innerHTML = html;

  // Add event listeners
  document.querySelectorAll('.filter-tag').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-tag').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      applyFilters();
    });
  });
}

function applyFilters() {
  const searchTerm = document.getElementById('searchInput').value.toLowerCase();
  
  const filtered = allCourses.filter(course => {
    const title = course.title.toLowerCase();
    const matchesSearch = title.includes(searchTerm);
    let matchesFilter = currentFilter === 'all';
    
    if (currentFilter !== 'all') {
      // Check for specific class number
      const classNumMatch = currentFilter.match(/\d+/);
      const classNum = classNumMatch ? classNumMatch[0] : null;
      
      if (classNum) {
        // Must have the number (e.g., 10 or 10th)
        matchesFilter = title.includes(classNum);
      } else if (currentFilter.includes('CUET')) {
        matchesFilter = title.includes('cuet');
      }

      // Refine by stream if present in filter
      if (currentFilter.includes('PCMB')) matchesFilter = matchesFilter && title.includes('pcmb');
      if (currentFilter.includes('Commerce')) matchesFilter = matchesFilter && title.includes('commerce');
      if (currentFilter.includes('Humanities')) matchesFilter = matchesFilter && title.includes('humanities');
      if (currentFilter.includes('(Science)')) matchesFilter = matchesFilter && title.includes('science');
    }
    
    return matchesSearch && matchesFilter;
  });

  renderCourses(filtered);
  updateResultsCount(filtered.length);
}

function updateResultsCount(count) {
  document.getElementById('resultsCount').innerHTML = 
    `Showing <span class="count-num">${count}</span> of <span class="count-num">${allCourses.length}</span> Batches`;
}

// Add search listener
document.getElementById('searchInput').addEventListener('input', applyFilters);

function extractClass(title) {
  const match = title.match(/class\s*(\d+)/i) || title.match(/(\d+)th/i);
  return match ? `CLASS ${match[1]}TH` : 'CLASS ALL';
}

function renderCourses(courses) {
  const grid = document.getElementById('courseGrid');
  const globalPlaceholder = 'https://d2alr3mt323vql.cloudfront.net/0/admin_v1/application_management/clientlogo/3390552566_Group%2018440%20%284%29.png';
  
  grid.innerHTML = courses.map((course, idx) => {
    const thumbnail = course.thumbnail || course.image_icon || globalPlaceholder;
    const title = course.title || 'Untitled Course';
    const classLabel = extractClass(title);
    const batchNum = (idx + 1).toString().padStart(2, '0');
    
    return `
      <div class="course-card" onclick="openCourse(${course.id})">
        <div class="card-image-wrap">
          <img class="card-image ${!course.thumbnail && !course.image_icon ? 'branded-placeholder' : ''}" 
               src="${thumbnail}" alt="${title}" 
               onerror="this.src='${globalPlaceholder}'; this.classList.add('branded-placeholder')">
          <div class="image-overlay"></div>
        </div>
        <div class="card-content">
          <div class="badge-container">
            <div class="card-badge">
              <div class="dot"></div>
              <span>${classLabel}</span>
            </div>
            ${course.is_old ? `
            <div class="card-badge old-badge">
              <div class="dot" style="background:var(--text-secondary); box-shadow:none;"></div>
              <span>OLD</span>
            </div>` : ''}
          </div>
          <h3 class="card-title">${title}</h3>
          <div class="card-meta">
            <div class="meta-item">
              <span class="meta-icon">📁</span>
              <span>Batch #${batchNum}</span>
            </div>
            <div class="meta-item">
              <span class="meta-icon">▶</span>
              <span>Start Anytime</span>
            </div>
          </div>
          <div class="card-footer">
            <span class="start-learning">Start Learning</span>
            <div class="arrow-btn">→</div>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function openCourse(courseId) {
  window.location.href = `course_dynamic.html?course_id=${courseId}`;
}

fetchCourses();
</script>
